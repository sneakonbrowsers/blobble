<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlobbleBrain Multi-Mode AI Client</title>
    
    <style>
        /* CSS STYLING */
        
        /* Box sizing fix to prevent elements from being pushed out of the viewport */
        * {
            box-sizing: border-box;
        }
        
        /* CRITICAL FIX: Ensure body and html take up full viewport height */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent body scroll, let inner elements scroll if needed */
        }

        /* General Setup for Full Viewport Layout */
        body {
            background-color: black; 
            font-family: sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRITICAL FIX: Anchor the app container to the full viewport */
        #app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- Positioning Elements - Default (Research Mode) Styles --- */

        /* 1. Blob positioning */
        #blobblebrain {
            width: 200px;
            height: 180px;
            z-index: 10;
            position: absolute;
            /* Default non-jiggling shape, will be overridden by the morph animation */
            border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Transition for color and size changes when switching modes */
            transition: all 0.5s ease-out, background-color 0.5s, box-shadow 0.5s, top 0.5s, left 0.5s, width 0.5s, height 0.5s; 
        }
        
        /* 2. Exit Buttons at Top Right */
        .exit-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            z-index: 30; 
            display: none; /* Hidden by default */
            transition: background-color 0.2s;
        }

        #exit-research-mode {
            background-color: #FF4500; /* Red for research */
        }
        #exit-research-mode:hover {
             background-color: #CC3700;
        }

        #exit-image-mode {
            background-color: #8A2BE2; /* Purple for image mode */
        }
        #exit-image-mode:hover {
            background-color: #6A1BA0;
        }

        /* 3. Response Box in the Middle */
        #response-bubble {
            position: absolute;
            padding: 25px;
            border-radius: 20px;
            overflow-y: auto; 
            font-size: 1.1em;
            transition: all 0.5s;
            text-align: center; /* Default center align for normal mode */
        }

        /* Styling for the error element inside the bubble */
        #raw-error {
            display: block;
            margin-top: 10px;
            font-size: 0.8em;
            color: #ffcccc; /* Light red text for emphasis */
            font-weight: bold;
        }

        /* 4. Sources Area (Research Mode only) */
        #sources-area {
            position: absolute;
            z-index: 5;
            transition: all 0.5s;
            background-color: #222; /* Sources background in Research Mode */
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9em;
            display: none; 
        }

        /* 5. Image Display Area (New for Image Mode) */
        #image-display-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 70%;
            max-width: 800px;
            max-height: 500px;
            overflow: hidden;
            display: none; /* Hidden by default */
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            background-color: #1a1a1a; /* Placeholder background */
            justify-content: center;
            align-items: center;
            color: #ccc;
            font-size: 1.2em;
            text-align: center;
        }

        #generated-image {
            max-width: 100%;
            max-height: 100%;
            display: block; 
            object-fit: contain; 
            border-radius: 15px;
        }
        
        /* 6. Input Area - FIXED TO BOTTOM FOR CLEAN MODE */
        #input-area {
            position: absolute;
            display: flex;
            gap: 10px;
            z-index: 20; 
            transition: all 0.5s;
            padding: 10px 0; 
            margin-bottom: 20px; /* Added margin to push it up slightly from the edge */
        }

        #user-input {
            flex-grow: 1;
            padding: 10px 15px;
            border: 1px solid #333;
            border-radius: 50px; 
            background-color: #1a1a1a; 
            color: white;
            font-size: 1em;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6); 
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #user-input:focus {
            border-color: #007AFF; 
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.6); 
        }

        #send-button {
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            white-space: nowrap; 
        }

        #send-button:disabled {
            background-color: #555 !important;
            cursor: not-allowed;
        }

        /* --- JIGGLE ANIMATIONS --- */

        /* 1. Shape morphing animation for realistic skin wobble */
        @keyframes morph {
            0% { border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; }
            33% { border-radius: 60% 40% 50% 50% / 60% 30% 70% 40%; }
            66% { border-radius: 70% 30% 60% 40% / 40% 70% 30% 60%; }
            100% { border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; }
        }

        /* 2. Positional jiggle for centered blobs (Normal/Research) - includes vertical floating and rotation */
        @keyframes jiggle-center {
            0% { transform: translate(-50%, 0) rotate(0deg); }
            25% { transform: translate(-50%, -8px) rotate(0.5deg); } 
            50% { transform: translate(-50%, 0) rotate(0deg); }
            75% { transform: translate(-50%, 8px) rotate(-0.5deg); }
            100% { transform: translate(-50%, 0) rotate(0deg); }
        }
        
        /* 3. Positional jiggle for corner blobs (Image Mode) - uses small relative shifts and rotation */
        @keyframes jiggle-corner {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, -1px) rotate(0.5deg); }
            55% { transform: translate(0, 0) rotate(0deg); }
            80% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Classes to apply the specific jiggle AND the shape morphing */
        .jiggling-center {
            /* Combine positional jiggle and shape morphing */
            animation: jiggle-center 4s ease-in-out infinite, morph 8s ease-in-out infinite;
        }

        .jiggling-corner {
            /* Combine positional jiggle and shape morphing */
            animation: jiggle-corner 4s ease-in-out infinite, morph 8s ease-in-out infinite;
        }

        /* Face Features */
        .eyes {
            display: flex;
            gap: 30px;
            position: absolute;
            top: 50px;
        }
        
        /* Adjust face features for smaller blobs (Image Mode and Shrunk Research Blob) */
        #blobblebrain.shrunk-mode .eyes {
            top: 30px; 
            gap: 15px;
        }
        #blobblebrain.image-mode .eyes {
            top: 30px;
            gap: 15px;
        }

        .eye {
            width: 20px;
            height: 25px;
            background-color: white;
            border-radius: 50%;
            box-shadow: inset 0 0 0 5px black;
        }
        
        /* Adjust eye size for smaller blobs */
        #blobblebrain.shrunk-mode .eye,
        #blobblebrain.image-mode .eye {
            width: 15px;
            height: 20px;
            box-shadow: inset 0 0 0 3px black;
        }

        .mouth {
            width: 40px;
            height: 5px;
            background-color: black;
            border-radius: 2px;
            position: absolute;
            bottom: 60px;
        }
        
        /* Adjust mouth size/position for smaller blobs */
        #blobblebrain.shrunk-mode .mouth,
        #blobblebrain.image-mode .mouth {
            width: 25px;
            bottom: 40px;
        }
        
        #response-text {
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        

<button id="exit-research-mode" class="exit-button" style="display:none;">Exit Research Mode</button>
        <button id="exit-image-mode" class="exit-button" style="display:none;">Exit Image Mode</button>
        
        <div id="blobblebrain"> 
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="mouth"></div>
        </div>

        <div id="response-bubble">
            <p id="response-text">Hello! What's on your mind?</p>
            <p id="raw-error" style="display: none;"></p>
        </div>
        
        

<div id="sources-area">
        </div>

        

<div id="image-display-area">
            <img id="generated-image" src="" alt="Generated image will appear here" style="display:none;">
            <p id="image-loading-text">Describe the image you want to create!</p>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const responseText = document.getElementById('response-text');
            const rawErrorDisplay = document.getElementById('raw-error');
            const responseBubble = document.getElementById('response-bubble');
            const blob = document.getElementById('blobblebrain');
            const exitResearchButton = document.getElementById('exit-research-mode');
            const exitImageButton = document.getElementById('exit-image-mode'); 
            const sourcesArea = document.getElementById('sources-area');
            const imageDisplayArea = document.getElementById('image-display-area'); 
            const generatedImage = document.getElementById('generated-image'); 
            const imageLoadingText = document.getElementById('image-loading-text'); 
            const inputArea = document.getElementById('input-area');

            // --- STATE & CONSTANTS ---
            let currentMode = 'normal'; // 'normal', 'research', 'image'
            const MAX_CHARS = 100;
            const apiKey = ""; 
            let lastImagePrompt = ''; // Store the last valid image prompt

            // Blob Size Constants
            const FULL_BLOB_WIDTH = '200px';
            const FULL_BLOB_HEIGHT = '180px';
            const SHRUNK_BLOB_WIDTH = '120px';
            const SHRUNK_BLOB_HEIGHT = '100px';

            // --- API MODELS & URLS (CRITICAL FIXES HERE) ---
            // CRITICAL FIX 1: Using gemini-2.5-flash for maximum accessibility and stability.
            const textModel = "gemini-2.5-flash"; 
            
            // Text API URL (uses generateContent endpoint)
            const textApiUrl = (typeof __gemini_api_url !== 'undefined' && __gemini_api_url) 
                ? __gemini_api_url 
                : (apiKey 
                    ? `https://generativelanguage.googleapis.com/v1beta/models/${textModel}:generateContent?key=${apiKey}`
                    : `https://generativelanguage.googleapis.com/v1beta/models/${textModel}:generateContent`);

            // CRITICAL FIX 2: Using the stable but older imagen-2.1 to bypass potential restrictions on newer 3.0.
            const imageModel = "imagen-2.1-generate-002";
            // Image API URL (uses predict endpoint)
            const imageApiUrl = apiKey 
                ? `https://generativelanguage.googleapis.com/v1beta/models/${imageModel}:predict?key=${apiKey}`
                : `https://generativelanguage.googleapis.com/v1beta/models/${imageModel}:predict`;
            
            
            /**
             * Checks for overlap between the Research Blob and the Response Bubble 
             * and adjusts the blob's size accordingly.
             * This only runs in Research Mode.
             */
            function checkCollisionAndResize() {
                if (currentMode !== 'research') return;

                // We need to wait for the browser to calculate the dimensions 
                // after setting the research mode CSS.
                setTimeout(() => {
                    const blobRect = blob.getBoundingClientRect();
                    const responseRect = responseBubble.getBoundingClientRect();

                    // Check for vertical overlap: is the top of the response bubble 
                    // higher than the bottom of the blob?
                    // We add a small buffer (20px) to prevent flicker.
                    const isOverlapping = responseRect.top < (blobRect.bottom + 20);

                    if (isOverlapping) {
                        // Shrink the blob
                        blob.style.width = SHRUNK_BLOB_WIDTH;
                        blob.style.height = SHRUNK_BLOB_HEIGHT;
                        // Add shrunk-mode class to adjust face features
                        blob.classList.add('shrunk-mode');
                    } else {
                        // Return to full size
                        blob.style.width = FULL_BLOB_WIDTH;
                        blob.style.height = FULL_BLOB_HEIGHT;
                        // Remove shrunk-mode class
                        blob.classList.remove('shrunk-mode');
                    }
                }, 50); // Small delay to ensure layout rendering is complete
            }

            // --- UI Update Functions ---
            function updateUIForMode() {
                // Hide all exit buttons and special areas first
                exitResearchButton.style.display = 'none';
                exitImageButton.style.display = 'none';
                sourcesArea.style.display = 'none';
                responseBubble.style.display = 'block'; 
                imageDisplayArea.style.display = 'none';
                generatedImage.style.display = 'none';
                imageLoadingText.style.display = 'none';
                rawErrorDisplay.style.display = 'none'; // Hide raw error on mode switch
                
                // Reset common blob attributes
                blob.classList.remove('image-mode', 'shrunk-mode'); // Clear all size/face modifiers
                blob.classList.remove('jiggling-center', 'jiggling-corner'); 
                blob.style.transform = ''; 

                if (currentMode === 'research') {
                    // --- RESEARCH MODE (RED) ---
                    
                    // Blob Style (Top Center) - Start at FULL SIZE
                    blob.style.backgroundColor = '#FF4500'; 
                    blob.style.boxShadow = '0 0 20px #FF4500, inset 0 0 10px rgba(255, 255, 255, 0.5)';
                    blob.style.top = '20px'; 
                    blob.style.left = '50%';
                    blob.style.right = 'auto'; 
                    blob.style.bottom = 'auto'; 
                    blob.style.marginTop = '0'; 
                    blob.style.marginLeft = '0'; 
                    // Set initial size (will be adjusted by checkCollisionAndResize)
                    blob.style.width = FULL_BLOB_WIDTH;
                    blob.style.height = FULL_BLOB_HEIGHT;
                    // Apply Centered Jiggle
                    blob.classList.add('jiggling-center');
                    
                    // Button Style
                    sendButton.style.backgroundColor = '#FF4500';
                    sendButton.onmouseover = () => { sendButton.style.backgroundColor = '#CC3700'; };
                    sendButton.onmouseout = () => { if (!sendButton.disabled) sendButton.style.backgroundColor = '#FF4500'; };
                    exitResearchButton.style.display = 'block'; 

                    // Response Box (Large, Central)
                    responseBubble.style.top = '50%';
                    responseBubble.style.left = '50%';
                    responseBubble.style.right = 'auto'; 
                    responseBubble.style.bottom = 'auto'; 
                    responseBubble.style.marginTop = '0'; 
                    responseBubble.style.marginLeft = '0';
                    responseBubble.style.transform = 'translate(-50%, -50%)';
                    responseBubble.style.width = '80%';
                    responseBubble.style.maxWidth = '900px';
                    responseBubble.style.minHeight = '200px';
                    responseBubble.style.textAlign = 'left'; 
                    responseBubble.style.backgroundColor = '#333';
                    responseBubble.style.boxShadow = '0 0 20px rgba(0, 0, 0, 0.5), 0 0 5px rgba(255, 255, 255, 0.1)';
                    
                    // Input Area (Bottom Right)
                    inputArea.style.bottom = '20px';
                    inputArea.style.right = '20px';
                    inputArea.style.left = 'auto';
                    inputArea.style.transform = 'none';
                    inputArea.style.width = '350px';
                    inputArea.style.maxWidth = '350px';
                    inputArea.style.marginLeft = '0'; 
                    inputArea.style.top = 'auto'; 
                    
                    // RUN COLLISION CHECK to shrink blob if necessary
                    checkCollisionAndResize();
                    
                    responseText.textContent = 'Research Mode is ON. I will give detailed, factual answers with sources.';

                } else if (currentMode === 'image') {
                    // --- IMAGE GENERATION MODE (PURPLE) ---
                    
                    // Blob Style (Top Left, Smaller)
                    blob.style.backgroundColor = '#8A2BE2'; 
                    blob.style.boxShadow = '0 0 20px #8A2BE2, inset 0 0 8px rgba(255, 255, 255, 0.4)';
                    blob.style.top = '10px'; 
                    blob.style.left = '10px';
                    blob.style.width = SHRUNK_BLOB_WIDTH; // Smaller blob
                    blob.style.height = SHRUNK_BLOB_HEIGHT;
                    blob.style.right = 'auto'; 
                    blob.style.bottom = 'auto'; 
                    blob.style.marginTop = '0'; 
                    blob.style.marginLeft = '0'; 
                    blob.style.transform = 'none'; // Ensure no transform for corner position
                    blob.classList.add('image-mode'); // Class for smaller eyes/mouth
                    // Apply Corner Jiggle
                    blob.classList.add('jiggling-corner');

                    // Hide response bubble
                    responseBubble.style.display = 'none';
                    
                    // Button Style
                    sendButton.style.backgroundColor = '#8A2BE2';
                    sendButton.onmouseover = () => { sendButton.style.backgroundColor = '#6A1BA0'; };
                    sendButton.onmouseout = () => { if (!sendButton.disabled) sendButton.style.backgroundColor = '#8A2BE2'; };
                    exitImageButton.style.display = 'block'; 

                    // Image Display Area (Centered)
                    imageDisplayArea.style.display = 'flex'; 
                    
                    // Input Area (Bottom Right)
                    inputArea.style.bottom = '20px';
                    inputArea.style.right = '20px';
                    inputArea.style.left = 'auto';
                    inputArea.style.transform = 'none';
                    inputArea.style.width = '350px';
                    inputArea.style.maxWidth = '350px';
                    inputArea.style.marginLeft = '0'; 
                    inputArea.style.top = 'auto'; 
                    
                    // Display current image prompt or instructions
                    if (lastImagePrompt) {
                        imageLoadingText.textContent = `Current image: "${lastImagePrompt}". Type a new prompt or "regenerate"!`;
                        generatedImage.style.display = 'block'; // Show last image if available
                    } else {
                         imageLoadingText.textContent = 'Describe the image you want to create!';
                    }


                } else {
                    // --- NORMAL MODE (CLEAN BLUE) ---
                    
                    // 1. Blob Style (Centered high up - 30% from top)
                    blob.style.backgroundColor = '#007AFF'; 
                    blob.style.boxShadow = '0 0 25px rgba(0, 122, 255, 0.8), inset 0 0 12px rgba(255, 255, 255, 0.6)';
                    blob.style.top = '30%'; 
                    blob.style.left = '50%'; 
                    blob.style.right = 'auto'; 
                    blob.style.bottom = 'auto'; 
                    blob.style.marginTop = '0'; 
                    blob.style.marginLeft = '0'; 
                    blob.style.width = FULL_BLOB_WIDTH;
                    blob.style.height = FULL_BLOB_HEIGHT;
                    // Apply Centered Jiggle, which includes the translateX(-50%)
                    blob.classList.add('jiggling-center');


                    // 2. Response Box (Centered horizontally - Moved down to 55%)
                    responseBubble.style.display = 'block';
                    responseBubble.style.top = '55%'; 
                    responseBubble.style.left = '50%'; 
                    responseBubble.style.right = 'auto'; 
                    responseBubble.style.bottom = 'auto'; 
                    responseBubble.style.marginTop = '0'; 
                    responseBubble.style.marginLeft = '0'; 
                    responseBubble.style.transform = 'translateX(-50%)'; 
                    
                    // Clean Aesthetic: Semi-transparent background with modern shadow
                    responseBubble.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                    responseBubble.style.boxShadow = '0 8px 32px 0 rgba(0, 0, 0, 0.37)'; 
                    
                    responseBubble.style.width = 'auto';
                    responseBubble.style.maxWidth = '600px'; 
                    responseBubble.style.minHeight = '0';
                    responseBubble.style.textAlign = 'center';
                    
                    // 3. Input Area (FIXED to bottom, wide and centered)
                    inputArea.style.top = 'auto'; 
                    inputArea.style.bottom = '20px'; 
                    inputArea.style.right = 'auto'; 
                    inputArea.style.left = '50%'; 
                    inputArea.style.marginLeft = '0'; 
                    inputArea.style.transform = 'translateX(-50%)'; 
                    inputArea.style.width = '90%';
                    inputArea.style.maxWidth = '700px'; 
                    
                    // Button Style
                    sendButton.style.backgroundColor = '#007AFF';
                    sendButton.onmouseover = () => { sendButton.style.backgroundColor = '#0056b3'; };
                    sendButton.onmouseout = () => { if (!sendButton.disabled) sendButton.style.backgroundColor = '#007AFF'; };
                    
                    responseText.textContent = 'Hello! What\'s on your mind?';
                }
            }
            
            // Function to manually switch back to Normal Mode
            const exitMode = () => {
                currentMode = 'normal';
                updateUIForMode();
            };

            // --- Utility for API Calls with Exponential Backoff ---
            async function fetchWithRetry(url, options, retries = 5) {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        
                        // Handle rate limiting with backoff
                        if (response.status === 429 && i < retries - 1) {
                            const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            continue;
                        }

                        if (!response.ok) {
                            // Throw error including status code for catch block to handle
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    } catch (error) {
                        if (i === retries - 1) {
                            throw error;
                        }
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
            
            // --- Function to call the Gemini API for text ---
            const getAIResponse = async (prompt) => {
                const researchRegex = /\bresearch\b/i;
                const imageRegex = /\b(make|create|generate)\s+(an\s+)?image\b/i; 
                
                const previousMode = currentMode;
                
                if (imageRegex.test(prompt)) {
                    currentMode = 'image';
                } else if (researchRegex.test(prompt)) {
                    currentMode = 'research';
                } else {
                    currentMode = 'normal';
                }
                
                if (previousMode !== currentMode) {
                    updateUIForMode(); // Update UI if mode changed
                }

                sendButton.disabled = true;
                sourcesArea.innerHTML = ''; 
                generatedImage.style.display = 'none';
                rawErrorDisplay.style.display = 'none'; // Hide previous error

                if (currentMode === 'image') {
                    const cleanPrompt = userInput.value.trim().toLowerCase();
                    if (cleanPrompt === 'regenerate') {
                        if (lastImagePrompt) {
                            getGeneratedImage(lastImagePrompt, true); // Pass true for regenerate
                        } else {
                            imageLoadingText.textContent = "Please provide an image prompt first before trying to regenerate!";
                            sendButton.disabled = false;
                            userInput.value = '';
                        }
                    } else {
                        // Store new image prompt only if it's not a trigger word
                        lastImagePrompt = prompt.replace(imageRegex, '').trim(); 
                        getGeneratedImage(lastImagePrompt); 
                    }
                    return; 
                }

                let systemInstruction;
                let tools = undefined;
                
                if (currentMode === 'research') {
                    systemInstruction = 'You are a professional research assistant. Provide detailed, factual, and comprehensive responses to the user\'s queries based on the provided search results. Do not use conversational fillers or exceed 2000 characters. Crucially, do not use any markdown formatting symbols, such as hashtags (#) or asterisks (*), in your response.';
                    tools = [{ "google_search": {} }]; 
                    responseText.textContent = `...thinking in Research Mode...`;
                } else { // Normal Mode
                    systemInstruction = 'You are BlobbleBrain, a playful AI module designed for fun, silly, and concise responses. Your absolute limit is 100 characters, including spaces and punctuation. You must always stay within this limit and be entertaining.';
                    responseText.textContent = `...thinking in Normal Mode...`;
                }
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: {
                        parts: [{ text: systemInstruction }]
                    },
                    tools: tools 
                };

                try {
                    const result = await fetchWithRetry(textApiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const candidate = result.candidates?.[0];
                    let aiText = "Oops! I lost my train of thought. Try asking something else!"; 
                    
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        aiText = candidate.content.parts[0].text;
                    }
                    
                    const groundingMetadata = candidate.groundingMetadata;
                    if (currentMode === 'research' && groundingMetadata && groundingMetadata.searchEntryPoint) {
                        // Sources area is hidden
                    }

                    const finalResponse = currentMode === 'research' ? aiText : aiText.substring(0, MAX_CHARS);
                    responseText.textContent = finalResponse;
                    
                } catch (error) {
                    console.error("Gemini API Error:", error);
                    // Check if the error is an HTTP status error
                    const match = error.message.match(/HTTP error! status: (\d+)/);
                    if (match) {
                        const statusCode = match[1];
                        rawErrorDisplay.textContent = `Error: API status ${statusCode}. Check model/permissions!`;
                        rawErrorDisplay.style.display = 'block';
                    } else {
                        rawErrorDisplay.textContent = `Unknown Error: ${error.message}`;
                        rawErrorDisplay.style.display = 'block';
                    }
                    // User-facing message
                    responseText.textContent = "Oops! My connection noodle broke. Try again in a minute!";
                } finally {
                    sendButton.disabled = false;
                    userInput.value = '';
                    // Re-run collision check after response is loaded, as text length might change response bubble height
                    if (currentMode === 'research') {
                         checkCollisionAndResize();
                    }
                }
            };

            // --- Function for Image Generation ---
            const getGeneratedImage = async (imagePrompt, isRegenerate = false) => {
                if (imagePrompt.length === 0) {
                    imageLoadingText.textContent = "Please provide an actual description to generate an image.";
                    sendButton.disabled = false;
                    userInput.value = '';
                    return;
                }
                
                if (isRegenerate) {
                    imageLoadingText.textContent = `Regenerating "${imagePrompt}"... This might take a moment!`;
                } else {
                    imageLoadingText.textContent = `Generating "${imagePrompt}"... This might take a moment!`;
                }
                generatedImage.style.display = 'none'; // Hide previous image
                imageLoadingText.style.display = 'block';
                
                try {
                    // *** PAYLOAD FOR imagen-2.1-generate-002 (predict endpoint) ***
                    const payload = { 
                        instances: [{ prompt: imagePrompt }], 
                        parameters: { "sampleCount": 1 } 
                    };
                    // *** END PAYLOAD ***

                    const result = await fetchWithRetry(imageApiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // *** RESPONSE PARSING FOR imagen-2.1-generate-002 ***
                    const base64Data = result.predictions?.[0]?.bytesBase64Encoded;
                    // *** END RESPONSE PARSING ***

                    if (base64Data) {
                        generatedImage.src = `data:image/png;base64,${base64Data}`;
                        generatedImage.alt = imagePrompt;
                        generatedImage.style.display = 'block';
                        imageLoadingText.style.display = 'none';
                    } else {
                         throw new Error("No image data or invalid response received from API.");
                    }

                } catch (error) {
                    console.error("Image Generation Error:", error);
                    imageLoadingText.textContent = `Failed to generate image. Please try again! Error: ${error.message}`;
                } finally {
                    sendButton.disabled = false;
                    userInput.value = '';
                    // Update display message after successful generation
                    if (generatedImage.style.display === 'block') {
                        imageLoadingText.textContent = `Current image: "${imagePrompt}". Type a new prompt or "regenerate"!`;
                    }
                }
            };


            // --- EVENT LISTENERS ---
            exitResearchButton.addEventListener('click', exitMode);
            exitImageButton.addEventListener('click', exitMode); 

            // Send button click
            sendButton.addEventListener('click', () => {
                const prompt = userInput.value.trim();
                if (prompt) {
                    getAIResponse(prompt);
                }
            });

            // Enter key press
            userInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter' && !sendButton.disabled) {
                    const prompt = userInput.value.trim();
                    if (prompt) {
                        getAIResponse(prompt);
                    }
                }
            });
            
            // Listen to window resize events to update the blob size if the response bubble size changes
            window.addEventListener('resize', () => {
                 if (currentMode === 'research') {
                    checkCollisionAndResize();
                 }
            });

            // Initial setup call
            updateUIForMode();
        });
    </script>
</body>
</html>
