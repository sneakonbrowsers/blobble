<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlobbleBrain AI App</title>
    

<script src="https://cdn.tailwindcss.com"></script>
    

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Prevent scroll for the full-screen effect */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Base Blob Styling (Invisible by default, rendered by JS) */
        .blob {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: transparent; /* Changed to transparent, color set by JS */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.5s ease-in-out, background-color 0.8s ease;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); /* Soft shadow */
            animation: jiggle 4s infinite ease-in-out, morph 8s ease-in-out infinite both;
            z-index: 10;
        }

        /* Specific Blob Styles */
        #normal-blob {
            background-color: #3b82f6; /* Blue */
            box-shadow: 0 0 30px #3b82f6;
            top: 5%; /* Higher */
            left: 50%;
            transform: translateX(-50%);
        }
        #research-blob {
            background-color: #ef4444; /* Red */
            box-shadow: 0 0 30px #ef4444;
            top: 50%; /* Default for research */
            left: calc(100% - 150px); /* Top Right Corner */
            transform: translate(-50%, -50%); /* Centered on its own corner point */
            width: 150px; /* Smaller in corner */
            height: 150px;
        }
        #image-blob {
            background-color: #9333ea; /* Purple */
            box-shadow: 0 0 30px #9333ea;
            top: 50%; /* Default for image */
            left: 150px; /* Top Left Corner */
            transform: translate(-50%, -50%); /* Centered on its own corner point */
            width: 150px; /* Smaller in corner */
            height: 150px;
        }

        .eye {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #000;
            border-radius: 50%;
        }

        .left-eye {
            left: 35%;
            top: 40%;
        }

        .right-eye {
            right: 35%;
            top: 40%;
        }

        .mouth {
            position: absolute;
            width: 40px;
            height: 5px;
            background-color: #000;
            border-radius: 2px;
            top: 60%;
        }

        /* Smaller eye/mouth for corner blobs */
        .corner-blob .eye {
            width: 12px;
            height: 12px;
        }
        .corner-blob .mouth {
            width: 25px;
            height: 3px;
        }


        #response-bubble {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.1); /* Semi-transparent */
            backdrop-filter: blur(8px); /* Glassmorphism effect */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem; /* More rounded */
            padding: 2rem; 
            max-width: 600px; /* Wider */
            min-height: 80px;
            
            /* SCROLLING FEATURE - Increased max-height */
            max-height: 60vh; 
            overflow-y: auto; 

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #e0e0e0;
            font-size: 1.1rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.5s ease-in-out;
            top: 45%; /* Centered vertically */
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 1;
            z-index: 5;
        }
        
        /* This rule ensures content inside the scrollable area has safe padding */
        #response-bubble pre {
            white-space: pre-wrap;
            margin: 0;
            padding: 0.5rem 0; /* Extra top/bottom padding for safer scrolling */
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }


        #input-area {
            position: absolute;
            bottom: 30px; /* Fixed at bottom */
            left: 50%;
            transform: translateX(-50%);
            width: 90%; /* Wider input */
            max-width: 700px;
            display: flex;
            gap: 10px;
            z-index: 20; /* Ensure it's always on top */
            padding: 10px; /* Padding for better visibility */
            background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent background for the bar */
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        #user-input {
            flex-grow: 1;
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 0.8rem;
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        #user-input:focus {
            background-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 2px #3b82f6;
        }
        #user-input::placeholder {
            color: #bbb;
        }

        #send-button {
            background-color: #3b82f6;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        #send-button:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        #send-button:disabled {
            background-color: #60a5f8;
            cursor: not-allowed;
        }

        #loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden by default */
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes jiggle {
            0% { transform: translateX(-50%) translateY(0px) rotate(0deg); }
            25% { transform: translateX(-50%) translateY(2px) rotate(0.5deg); }
            50% { transform: translateX(-50%) translateY(0px) rotate(0deg); }
            75% { transform: translateX(-50%) translateY(-2px) rotate(-0.5deg); }
            100% { transform: translateX(-50%) translateY(0px) rotate(0deg); }
        }

        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            33% { border-radius: 70% 30% 50% 50% / 60% 40% 40% 60%; }
            66% { border-radius: 50% 50% 30% 70% / 50% 60% 40% 40%; }
        }

        /* Image Mode Specific Styling */
        #image-output-container {
            width: 100%;
            height: auto;
            max-width: 500px;
            max-height: 500px;
            margin: 0 auto;
            border: 2px dashed #9333ea; /* Purple border for image mode */
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 200px; /* Ensure visibility */
            overflow: hidden; /* To contain the image/canvas */
        }
        #image-output {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.8rem;
        }
        #image-output-canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0.8rem;
        }
        
        .loading-message {
            color: #3b82f6;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .loading-message .spinner {
            display: block;
        }
        
    </style>
</head>
<body>
    <div id="app-container">
        

<div id="normal-blob" class="blob current-blob">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
        </div>
        <div id="research-blob" class="blob hidden corner-blob">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
        </div>
        <div id="image-blob" class="blob hidden corner-blob">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
        </div>

        

<div id="response-bubble">Hello! What's on your mind?</div>
        
        

<div id="input-area">
            <input type="text" id="user-input" placeholder="Ask a question..." />
            <button id="send-button">Send</button>
            <div id="loader" class="spinner"></div>
        </div>
    </div>

    <script>
        // --- Firebase Globals (Required but not used for this basic API demo) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        // RENAMED local constant to 'initialAuthToken' to avoid TDZ ReferenceError
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null; 
        // --- End Firebase Globals ---

        // --- API Constants ---
        const API_KEY = "AIzaSyCGQAM_W9iytieFVQAwTXZf6sv5f2Ns5Q8"; // Your API Key
        const TEXT_MODEL = "gemini-2.5-flash-preview-09-2025"; // Stable for text
        const IMAGE_MODEL = "gemini-2.5-flash-image-preview"; // FIX: Switched to a model available in this environment

        // --- UI Elements ---
        const normalBlob = document.getElementById('normal-blob');
        const researchBlob = document.getElementById('research-blob');
        const imageBlob = document.getElementById('image-blob');
        const responseBubble = document.getElementById('response-bubble');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const loader = document.getElementById('loader');
        const inputArea = document.getElementById('input-area'); // Corrected variable definition
        const appContainer = document.getElementById('app-container');

        let currentMode = 'normal'; // 'normal', 'research', 'image'
        let currentPrompt = ''; // Store the last prompt for image regeneration

        // --- Event Listeners ---
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) {
                handleUserInput();
            }
        });
        sendButton.addEventListener('click', handleUserInput);

        // --- Helper Functions ---
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        /**
         * Generic API call with exponential backoff and retries.
         * @param {string} url - The API endpoint URL.
         * @param {object} options - Fetch options (method, headers, body).
         * @param {number} maxRetries - Maximum number of retries.
         * @param {string} mode - The current mode ('Normal', 'Research', 'Image') for status messages.
         */
        async function generateWithRetry(url, options, maxRetries = 3, mode = 'Normal') {
            const tempOutputDiv = document.createElement('div'); // Create a temporary div for status updates
            responseBubble.innerHTML = ''; // Clear bubble
            responseBubble.appendChild(tempOutputDiv);

            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    // Update status in the bubble
                    if (mode === 'image') {
                        tempOutputDiv.innerHTML = `<div class="loading-message"><div class="spinner"></div> Making your image come to life! (Attempt ${attempt + 1}/${maxRetries})</div>`;
                    } else {
                        // Thinking...
                        tempOutputDiv.textContent = `Thinking... (Attempt ${attempt + 1}/${maxRetries})`; 
                    }
                    
                    const response = await fetch(url, options);

                    // Check for rate limits (429) or server errors (5xx) that warrant a retry
                    if (response.status === 429 || response.status >= 500) {
                        if (attempt < maxRetries - 1) {
                            const delay = Math.pow(2, attempt) * 1000 + Math.random() * 500; // Exponential backoff + jitter
                            tempOutputDiv.textContent += ` Server error (${response.status}). Retrying in ${Math.round(delay / 1000)}s...`;
                            await sleep(delay);
                            continue; // Go to next attempt
                        }
                    }

                    // For any non-retryable error (e.g., 400 Bad Request, 401 Unauthorized/API Key issue)
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const message = errorData.error?.message || `HTTP Error ${response.status}: ${response.statusText}`;
                        throw new Error(message);
                    }

                    // Success
                    return await response.json();

                } catch (error) {
                    // Catch network errors (like DNS lookup failure, timeout, etc.)
                    if (attempt < maxRetries - 1) {
                        const delay = Math.pow(2, attempt) * 1000 + Math.random() * 500;
                        tempOutputDiv.textContent = `Network/API error. Retrying in ${Math.round(delay / 1000)}s...`;
                        await sleep(delay);
                        console.error(`Attempt ${attempt + 1} failed:`, error.message);
                        continue;
                    }
                    throw error; // Re-throw the error if all retries fail
                }
            }
            throw new Error("API request failed after all retries.");
        }


        /**
         * Switches the active blob and updates UI for the given mode.
         * @param {string} mode - 'normal', 'research', 'image'
         */
        function updateUIForMode(mode) {
            currentMode = mode;
            const allBlobs = [normalBlob, researchBlob, imageBlob];
            const currentBlobElement = document.getElementById(`${mode}-blob`);

            allBlobs.forEach(blob => {
                blob.classList.add('hidden');
                blob.classList.remove('current-blob', 'corner-blob'); // Clean up classes
            });
            
            currentBlobElement.classList.remove('hidden');
            currentBlobElement.classList.add('current-blob');

            // Adjust input area position based on mode
            if (mode === 'normal') {
                responseBubble.style.top = '45%';
                responseBubble.style.left = '50%';
                responseBubble.style.transform = 'translate(-50%, -50%)';
                responseBubble.style.maxWidth = '600px';

                inputArea.style.bottom = '30px';
                inputArea.style.left = '50%';
                inputArea.style.transform = 'translateX(-50%)';
                inputArea.style.width = '90%';
            } else {
                responseBubble.style.top = '50%';
                responseBubble.style.left = '50%';
                responseBubble.style.transform = 'translate(-50%, -50%)';
                responseBubble.style.maxWidth = 'calc(100% - 300px)'; // Make room for corner blobs
                
                inputArea.style.bottom = '30px';
                inputArea.style.right = '30px';
                inputArea.style.left = 'auto'; // Disable left positioning
                inputArea.style.transform = 'none'; // Disable transform
                inputArea.style.width = 'calc(100% - 300px)'; // Make room for corner blobs
            }
            
            // Adjust corner blob positions
            if (mode === 'research') {
                normalBlob.classList.remove('hidden');
                normalBlob.classList.add('corner-blob');
                normalBlob.style.top = '50px'; /* Top Right Corner */
                normalBlob.style.left = 'calc(100% - 150px)';
                normalBlob.style.transform = 'none';
            } else if (mode === 'image') {
                normalBlob.classList.remove('hidden');
                normalBlob.classList.add('corner-blob');
                normalBlob.style.top = '50px'; /* Top Left Corner */
                normalBlob.style.left = '100px';
                normalBlob.style.transform = 'none';
            }
        }


        /**
         * Main handler for user input. Determines mode and calls appropriate API function.
         */
        async function handleUserInput() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            sendButton.disabled = true;
            loader.style.display = 'block';
            userInput.value = ''; // Clear input

            responseBubble.innerHTML = ''; // Clear previous response

            let newMode = currentMode;
            if (prompt.toLowerCase().includes('research') && currentMode !== 'research') {
                newMode = 'research';
            } else if ((prompt.toLowerCase().includes('generate an image') || prompt.toLowerCase().includes('create an image')) && currentMode !== 'image') {
                newMode = 'image';
                currentPrompt = prompt.replace(/generate an image of|create an image of/i, '').trim(); // Extract image prompt
            } else if (currentMode !== 'normal' && !prompt.toLowerCase().includes('research') && !prompt.toLowerCase().includes('image')) {
                newMode = 'normal';
            }
            
            updateUIForMode(newMode);

            try {
                if (newMode === 'image') {
                    await getGeneratedImage(currentPrompt);
                } else {
                    await getAIResponse(prompt, newMode);
                }
            } catch (error) {
                console.error("API call failed:", error);
                // Display the specific error message from generateWithRetry
                responseBubble.innerHTML = `<div style="color:red; font-weight:bold;">Error: ${error.message}</div>`;
            } finally {
                sendButton.disabled = false;
                loader.style.display = 'none';
            }
        }


        /**
         * Handles fetching AI responses for normal and research modes.
         */
        async function getAIResponse(prompt, mode) {
            const isResearch = mode === 'research';
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent?key=${API_KEY}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: isResearch ? [{ google_search: {} }] : undefined,
                systemInstruction: {
                    parts: [{ text: isResearch 
                        ? "You are a research assistant. Provide factual answers based on search results."
                        : "You are a general-purpose AI. Be helpful and concise." 
                    }]
                }
            };

            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            try {
                const result = await generateWithRetry(apiUrl, options, 3, mode);
            
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    let generatedText = candidate.content.parts[0].text;
                    let sourcesText = "";

                    // CLEANUP STEP: Remove common Markdown characters * and #
                    generatedText = generatedText.replace(/(\*\*|\*|##|#)/g, ''); 

                    // Extract and format citations for research mode
                    if (isResearch) {
                        const groundingMetadata = candidate.groundingMetadata;
                        if (groundingMetadata && groundingMetadata.groundingAttributions) {
                            const sources = groundingMetadata.groundingAttributions
                                .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
                                .filter(source => source.uri && source.title);
                            
                            if (sources.length > 0) {
                                sourcesText = "\n\n--- Sources ---\n";
                                sources.forEach((s, index) => {
                                    sourcesText += `${index + 1}. [${s.title}](${s.uri})\n`;
                                });
                            }
                        }
                    }
                    // Use innerHTML and pre tag. CSS handles the specific formatting.
                    responseBubble.innerHTML = `<pre>${generatedText + sourcesText}</pre>`;
                } else {
                    responseBubble.textContent = `Error: Empty or malformed response from ${mode} API.`;
                }
            } catch (error) {
                // generateWithRetry already updated the bubble, just re-throw to stop
                throw error; 
            }
        }

        /**
         * Handles fetching generated images for image mode.
         */
        async function getGeneratedImage(prompt) {
            // FIX: Changed URL construction for gemini-2.5-flash-image-preview
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL}:generateContent?key=${API_KEY}`;
            
            // FIX: Changed payload structure for gemini-2.5-flash-image-preview
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ['IMAGE']
                },
            };


            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            try {
                const result = await generateWithRetry(apiUrl, options, 3, 'image');

                // FIX: Adjusted response parsing for gemini-2.5-flash-image-preview
                const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

                if (base64Data) {
                    const imageUrl = `data:image/png;base64,${base64Data}`;
                    
                    responseBubble.innerHTML = `
                        <div id="image-output-container">
                            <p class="mb-2 text-sm text-gray-400">Prompt: "${prompt}"</p>
                            <img id="image-output" src="${imageUrl}" alt="Generated Image by BlobbleBrain">
                        </div>
                    `;
                } else {
                    responseBubble.innerHTML = `<div style="color:red; font-weight:bold;">Image API did not return valid image data. Try a different prompt.</div>`;
                }
            } catch (error) {
                // If generateWithRetry throws, it already updated the bubble
                throw error; 
            }
        }

        // Initialize UI on load
        document.addEventListener('DOMContentLoaded', () => {
            updateUIForMode('normal'); // Default to normal mode
        });
    </script>
</body>
</html>
