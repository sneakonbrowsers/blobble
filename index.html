<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlobbleBrain AI App (Offset Blob)</title>
    

<script src="https://cdn.tailwindcss.com"></script>
    

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Base Blob Styling - No fixed position here, controlled by JS */
        .blob {
            position: absolute;
            width: 200px; 
            height: 200px; 
            background-color: transparent; 
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.5s ease-in-out, background-color 0.8s ease;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); 
            animation: jiggle 4s infinite ease-in-out, morph 8s ease-in-out infinite both;
            z-index: 10;
        }

        /* Specific Blob Colors */
        #normal-blob { 
            background-color: #3b82f6; 
            box-shadow: 0 0 30px #3b82f6; 
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.7));
        }
        #research-blob { background-color: #ef4444; box-shadow: 0 0 30px #ef4444; }
        #image-blob { background-color: #9333ea; box-shadow: 0 0 30px #9333ea; }

        .eye {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #000;
            border-radius: 50%;
        }
        .left-eye { left: 35%; top: 40%; }
        .right-eye { right: 35%; top: 40%; }
        .mouth {
            position: absolute;
            width: 40px;
            height: 5px;
            background-color: #000;
            border-radius: 2px;
            top: 60%;
        }

        /* Corner Blob (Passive) Styling - Applied by JS */
        .corner-blob .eye {
            width: 12px;
            height: 12px;
        }
        .corner-blob .mouth {
            width: 25px;
            height: 3px;
        }


        #response-bubble {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem; 
            padding: 2rem; 
            min-height: 80px;
            overflow-y: auto; 
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #e0e0e0;
            font-size: 1.05rem; 
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.5s ease-in-out;
            z-index: 5;
        }
        
        /* Ensures content inside the scrollable area wraps and fits */
        #response-bubble pre {
            white-space: pre-wrap;
            word-break: break-word; 
            margin: 0;
            padding: 0.5rem 0; 
            text-align: left; /* Text remains left-aligned inside the bubble */
            width: 100%;
            box-sizing: border-box;
        }


        #input-area {
            position: absolute;
            bottom: 30px; 
            display: flex;
            gap: 10px;
            z-index: 20; 
            padding: 10px; 
            background-color: rgba(0, 0, 0, 0.6); 
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            /* Initial positioning, overridden by JS */
            left: 50%;
            transform: translateX(-50%);
            width: 90%; 
            max-width: 700px;
        }

        #user-input {
            flex-grow: 1;
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 0.8rem;
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        #user-input:focus {
            background-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 2px #3b82f6;
        }
        #user-input::placeholder {
            color: #bbb;
        }

        #send-button {
            background-color: #3b82f6;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        #send-button:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        #send-button:disabled {
            background-color: #60a5f8;
            cursor: not-allowed;
        }

        #loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none; 
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Jiggle and Morph animations */
        @keyframes jiggle {
            0% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(2px) rotate(0.5deg); }
            50% { transform: translateY(0px) rotate(0deg); }
            75% { transform: translateY(-2px) rotate(-0.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            33% { border-radius: 70% 30% 50% 50% / 60% 40% 40% 60%; }
            66% { border-radius: 50% 50% 30% 70% / 50% 60% 40% 40%; }
        }

        /* Image Mode Specific Styling */
        #image-output-container {
            width: 100%;
            height: auto;
            max-width: 500px;
            max-height: 500px;
            margin: 0 auto;
            border: 2px dashed #9333ea; 
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 200px; 
            overflow: hidden; 
        }
        #image-output {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.8rem;
        }
        
        .loading-message {
            color: #3b82f6;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .loading-message .spinner {
            display: block;
        }
        
    </style>
</head>
<body>
    <div id="app-container">
        

<div id="normal-blob" class="blob current-blob">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
        </div>
        <div id="research-blob" class="blob hidden corner-blob">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
        </div>
        <div id="image-blob" class="blob hidden corner-blob">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
        </div>

        

<div id="response-bubble">Hello! Ask me about anything, or type **'research'** or **'generate an image'** to switch modes!</div>
        
        

<div id="input-area">
            <input type="text" id="user-input" placeholder="Ask a question..." />
            <button id="send-button">Send</button>
            <div id="loader" class="spinner"></div>
        </div>
    </div>

    <script>
        // --- Firebase Globals (Required but not used for this basic API demo) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null; 
        // --- End Firebase Globals ---

        // --- API Constants ---
        const API_KEY = ""; 
        const TEXT_MODEL = "gemini-2.5-flash-preview-09-2025"; 
        const IMAGE_MODEL = "gemini-2.5-flash-image-preview"; 

        // --- Blob Sizing Constants ---
        const ACTIVE_BLOB_SIZE = '180px';
        const PASSIVE_BLOB_SIZE = '120px';
        const MAX_CHAT_HEIGHT = '60vh'; 

        // --- UI Elements ---
        const normalBlob = document.getElementById('normal-blob');
        const researchBlob = document.getElementById('research-blob');
        const imageBlob = document.getElementById('image-blob');
        const responseBubble = document.getElementById('response-bubble');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const loader = document.getElementById('loader');
        const inputArea = document.getElementById('input-area'); 
        const appContainer = document.getElementById('app-container');

        let currentMode = 'normal'; 
        let currentPrompt = ''; 

        // --- Event Listeners ---
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) {
                handleUserInput();
            }
        });
        sendButton.addEventListener('click', handleUserInput);

        // --- Helper Functions ---
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        /**
         * Generic API call with exponential backoff and retries.
         */
        async function generateWithRetry(url, options, maxRetries = 3, mode = 'Normal') {
            const tempOutputDiv = document.createElement('div'); 
            // Ensure the content inside the bubble is treated as pre-formatted text for reading mode
            responseBubble.innerHTML = ''; 
            const preElement = document.createElement('pre');
            preElement.appendChild(tempOutputDiv);
            responseBubble.appendChild(preElement);

            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    if (mode === 'image') {
                        tempOutputDiv.innerHTML = `<div class="loading-message"><div id="loader" class="spinner"></div> Making your image come to life! (Attempt ${attempt + 1}/${maxRetries})</div>`;
                    } else {
                        tempOutputDiv.textContent = `Thinking... (Attempt ${attempt + 1}/${maxRetries})`; 
                    }
                    
                    const response = await fetch(url, options);

                    if (response.status === 429 || response.status >= 500) {
                        if (attempt < maxRetries - 1) {
                            const delay = Math.pow(2, attempt) * 1000 + Math.random() * 500; 
                            tempOutputDiv.textContent += ` Server error (${response.status}). Retrying in ${Math.round(delay / 1000)}s...`;
                            await sleep(delay);
                            continue; 
                        }
                    }

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const message = errorData.error?.message || `HTTP Error ${response.status}: ${response.statusText}`;
                        throw new Error(message);
                    }

                    return await response.json();

                } catch (error) {
                    if (attempt < maxRetries - 1) {
                        const delay = Math.pow(2, attempt) * 1000 + Math.random() * 500;
                        tempOutputDiv.textContent = `Network/API error. Retrying in ${Math.round(delay / 1000)}s...`;
                        await sleep(delay);
                        console.error(`Attempt ${attempt + 1} failed:`, error.message);
                        continue;
                    }
                    throw error; 
                }
            }
            throw new Error("API request failed after all retries.");
        }


        /**
         * Clears all positional and size styles from a blob element.
         */
        function cleanupBlobStyles(blobElement) {
            blobElement.style.top = '';
            blobElement.style.bottom = '';
            blobElement.style.left = '';
            blobElement.style.right = '';
            blobElement.style.transform = '';
            blobElement.style.width = '';
            blobElement.style.height = '';
        }

        /**
         * Switches the active blob and updates UI for the given mode.
         */
        function updateUIForMode(mode) {
            currentMode = mode;
            const allBlobs = [normalBlob, researchBlob, imageBlob];
            
            // 1. Cleanup all blobs and set class status
            allBlobs.forEach(blob => {
                cleanupBlobStyles(blob);
                blob.classList.add('hidden');
                blob.classList.remove('current-blob', 'corner-blob');
            });
            
            const currentBlobElement = document.getElementById(`${mode}-blob`);
            currentBlobElement.classList.remove('hidden');
            currentBlobElement.classList.add('current-blob');
            
            // --- 2. LAYOUT SWITCHING: Normal (Offset) vs. Split (Left Panel) ---

            if (mode === 'normal') {
                // OFFSET BLOB, CENTRED BUBBLE BELOW
                
                // Active Blob: Shifted Up and Left (Interpreting 3.5 inches as a 10% viewport shift)
                currentBlobElement.style.width = '200px';
                currentBlobElement.style.height = '200px';
                currentBlobElement.style.top = '40%'; // Shifted up
                currentBlobElement.style.left = '40%'; // Shifted left
                currentBlobElement.style.transform = 'translate(-50%, -50%)'; // Maintain center alignment based on new percentage position

                // Response Bubble: Centered horizontally, below the blob's new vertical position
                responseBubble.style.top = '65%'; // Adjusted to sit below the blob
                responseBubble.style.bottom = 'auto'; 
                responseBubble.style.left = '50%'; 
                responseBubble.style.right = 'auto'; 
                responseBubble.style.transform = 'translateX(-50%)'; // Horizontal centering
                responseBubble.style.maxWidth = '600px';
                responseBubble.style.textAlign = 'center'; 
                responseBubble.style.maxHeight = MAX_CHAT_HEIGHT; 
                
                // Input Area: Fixed at the bottom center
                inputArea.style.bottom = '30px';
                inputArea.style.left = '50%';
                inputArea.style.right = 'auto';
                inputArea.style.transform = 'translateX(-50%)';
                inputArea.style.width = '90%';
                inputArea.style.maxWidth = '700px';

            } else {
                // SPLIT LAYOUT (Research/Image) - Text/Input on Left, Blobs on Right
                
                // Response Bubble: Fills the entire left/center area
                responseBubble.style.top = '30px'; 
                responseBubble.style.bottom = '110px'; 
                responseBubble.style.left = '30px'; 
                responseBubble.style.right = '260px'; // Leaves 230px for the blob panel + 30px margin
                responseBubble.style.transform = 'none'; 
                responseBubble.style.maxWidth = 'none'; 
                responseBubble.style.textAlign = 'left';
                responseBubble.style.maxHeight = 'none'; // Allow full height scroll
                
                // Input Area: Fills the bottom area below the response bubble
                inputArea.style.bottom = '30px';
                inputArea.style.left = '30px';
                inputArea.style.right = '260px';
                inputArea.style.transform = 'none'; 
                inputArea.style.width = 'auto'; 
                inputArea.style.maxWidth = 'none';


                // --- 3. SPLIT LAYOUT BLOB POSITIONING ---
                
                // Active Blob: Larger, centered vertically on the right panel
                currentBlobElement.style.width = ACTIVE_BLOB_SIZE;
                currentBlobElement.style.height = ACTIVE_BLOB_SIZE;
                currentBlobElement.style.top = '50%';
                currentBlobElement.style.right = '70px'; 
                currentBlobElement.style.transform = 'translateY(-50%)';
                
                // Set passive blobs based on mode
                if (mode === 'research') {
                    // Passive Blob: Blue (Normal), small, top right corner
                    normalBlob.classList.remove('hidden');
                    normalBlob.classList.add('corner-blob');
                    normalBlob.style.width = PASSIVE_BLOB_SIZE;
                    normalBlob.style.height = PASSIVE_BLOB_SIZE;
                    normalBlob.style.top = '50px';
                    normalBlob.style.right = '50px';
                    
                } else if (mode === 'image') {
                    // Passive Blob: Blue (Normal), small, top right corner
                    normalBlob.classList.remove('hidden');
                    normalBlob.classList.add('corner-blob');
                    normalBlob.style.width = PASSIVE_BLOB_SIZE;
                    normalBlob.style.height = PASSIVE_BLOB_SIZE;
                    normalBlob.style.top = '50px';
                    normalBlob.style.right = '50px';

                    // Passive Blob: Red (Research), small, bottom right corner
                    researchBlob.classList.remove('hidden');
                    researchBlob.classList.add('corner-blob');
                    researchBlob.style.width = PASSIVE_BLOB_SIZE;
                    researchBlob.style.height = PASSIVE_BLOB_SIZE;
                    researchBlob.style.top = 'auto';
                    researchBlob.style.bottom = '50px';
                    researchBlob.style.right = '50px'; 
                }
            }
        }


        /**
         * Main handler for user input. Determines mode and calls appropriate API function. 
         */
        async function handleUserInput() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            sendButton.disabled = true;
            loader.style.display = 'block';
            userInput.value = ''; 

            responseBubble.innerHTML = ''; 

            let newMode = currentMode;
            // Check if the prompt requires a mode switch
            if (prompt.toLowerCase().includes('research') && currentMode !== 'research') {
                newMode = 'research';
            } else if ((prompt.toLowerCase().includes('generate an image') || prompt.toLowerCase().includes('create an image')) && currentMode !== 'image') {
                newMode = 'image';
                // Store cleaned prompt for image mode
                currentPrompt = prompt.replace(/generate an image of|create an image of/i, '').trim(); 
            } else if (currentMode !== 'normal' && !prompt.toLowerCase().includes('research') && !prompt.toLowerCase().includes('image')) {
                // If we're not asking for research/image anymore, revert to normal
                newMode = 'normal';
            }
            
            updateUIForMode(newMode);

            try {
                if (newMode === 'image') {
                    await getGeneratedImage(currentPrompt);
                } else {
                    await getAIResponse(prompt, newMode);
                }
            } catch (error) {
                console.error("API call failed:", error);
                responseBubble.innerHTML = `<pre style="color:red; font-weight:bold;">Error: ${error.message}</pre>`;
            } finally {
                sendButton.disabled = false;
                loader.style.display = 'none';
            }
        }


        /**
         * Handles fetching AI responses for normal and research modes. 
         */
        async function getAIResponse(prompt, mode) {
            const isResearch = mode === 'research';
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent?key=${API_KEY}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: isResearch ? [{ google_search: {} }] : undefined,
                systemInstruction: {
                    parts: [{ text: isResearch 
                        ? "You are a research assistant. Provide factual answers based on search results."
                        : "You are a general-purpose AI. Be helpful and concise." 
                    }]
                }
            };

            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            try {
                const result = await generateWithRetry(apiUrl, options, 3, mode);
            
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    let generatedText = candidate.content.parts[0].text;
                    let sourcesText = "";

                    generatedText = generatedText.replace(/(\*\*|\*|##|#)/g, ''); 

                    if (isResearch) {
                        const groundingMetadata = candidate.groundingMetadata;
                        if (groundingMetadata && groundingMetadata.groundingAttributions) {
                            const sources = groundingMetadata.groundingAttributions
                                .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
                                .filter(source => source.uri && source.title);
                            
                            if (sources.length > 0) {
                                sourcesText = "\n\n--- Sources ---\n";
                                sources.forEach((s, index) => {
                                    sourcesText += `${index + 1}. [${s.title}](${s.uri})\n`;
                                });
                            }
                        }
                    }
                    responseBubble.querySelector('pre').textContent = generatedText + sourcesText;
                    // Ensure text alignment is correct for the current mode
                    responseBubble.style.textAlign = mode === 'normal' ? 'center' : 'left'; 

                } else {
                    responseBubble.innerHTML = `<pre>Error: Empty or malformed response from ${mode} API.</pre>`;
                }
            } catch (error) {
                throw error; 
            }
        }

        /**
         * Handles fetching generated images for image mode. 
         */
        async function getGeneratedImage(prompt) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL}:generateContent?key=${API_KEY}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ['IMAGE']
                },
            };


            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            try {
                const result = await generateWithRetry(apiUrl, options, 3, 'image');

                const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

                if (base64Data) {
                    const imageUrl = `data:image/png;base64,${base64Data}`;
                    
                    responseBubble.innerHTML = `
                        <div id="image-output-container">
                            <p class="mb-2 text-sm text-gray-400">Prompt: "${prompt}"</p>
                            <img id="image-output" src="${imageUrl}" alt="Generated Image by BlobbleBrain">
                        </div>
                    `;
                    // When in image mode, text alignment must be 'center' for the image container
                    responseBubble.style.textAlign = 'center'; 
                } else {
                    responseBubble.innerHTML = `<pre style="color:red; font-weight:bold;">Image API did not return valid image data. Try a different prompt.</pre>`;
                }
            } catch (error) {
                throw error; 
            }
        }

        // Initialize UI on load
        document.addEventListener('DOMContentLoaded', () => {
            updateUIForMode('normal'); // Default to normal mode
        });
    </script>
</body>
</html>
